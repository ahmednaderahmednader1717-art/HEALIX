name: test_splash
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.1
  path_provider: ^2.1.5
  gap: ^3.0.1
  google_fonts: ^6.3.2
  carousel_slider: ^5.1.1
  skeletonizer: ^2.1.0+1
  dio: ^5.9.0
  google_sign_in: ^6.2.1
  shared_preferences: ^2.3.2
  shelf_proxy: ^1.0.1
  curved_navigation_bar: ^1.0.6
  curved_labeled_navigation_bar: ^2.0.6
  http: ^1.5.0
  image_picker: ^1.0.7
  file_picker: ^10.3.6
  cached_network_image: ^3.3.1

  dotted_border: ^2.0.0
  percent_indicator: ^4.2.2
  universal_platform: ^1.0.0+1 # لمعرفة النظام الحالي
  ionicons: ^0.2.2
  font_awesome_flutter: ^10.12.0
  intl: ^0.19.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/appicon/playstore.png"
  image_path_ios: "assets/appicon/appstore.png"
  adaptive_icon_foreground: "assets/appicon/playstore.png"
  adaptive_icon_background: "#ffffff"
  min_sdk_android: 21
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - assets/SVGs/
    - assets/covers/
    - assets/icons/

